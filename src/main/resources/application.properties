# ─── PostgreSQL ──────────────────────────────────────────────────────────────
# Override any of these at runtime with env vars: PG_HOST, PG_PORT, PG_DB, PG_USER, PG_PASS
db.pg.host=localhost
db.pg.port=5432
db.pg.name=ingestor
db.pg.user=admin
db.pg.pass=admin

# ─── Neo4j ───────────────────────────────────────────────────────────────────
# Override at runtime with env vars: NEO4J_URI, NEO4J_USER, NEO4J_PASS
db.neo4j.uri=bolt://localhost:7687
db.neo4j.user=neo4j
db.neo4j.pass=admin

# ─── OpenAI — Embeddings ─────────────────────────────────────────────────────
# Override model at runtime with env var: OPENAI_EMBED_MODEL
# Set openai.embed.url to an Azure OpenAI or proxy endpoint if needed
openai.embed.url=https://api.openai.com/v1/embeddings
openai.embed.model=text-embedding-3-small
openai.embed.batch-size=50
# IMPORTANT: changing dims requires recreating the pgvector column (vector(1536))
openai.embed.dims=1536

# ─── OpenAI — Chat Completions (LLM enrichment) ──────────────────────────────
# Override model at runtime with env var: OPENAI_ENRICH_MODEL (NOT the generic
# OPENAI_MODEL — deliberately no fallback to it; see LlmEnricher's Javadoc.
# Confirmed directly: a stray OPENAI_MODEL=gpt-4o in the environment, set for
# an unrelated reason, silently forced enrichment onto the SAME model as chunk
# analysis — same contested rate-limit budget, defeating the whole point of
# enrichment running on a separate model with its own headroom).
# Kept on gpt-4o-mini deliberately: enrichment is best-effort sectionPurpose
# polish on top of already-good chunk-analysis purposes, not essential like
# chunk analysis itself — cheaper/faster model is the right tradeoff here.
# Set openai.chat.url to an Azure OpenAI or proxy endpoint if needed
openai.chat.url=https://api.openai.com/v1/chat/completions
openai.enrich.model=gpt-4o-mini
# Max COBOL content characters per LLM call — controls token usage
openai.chat.max-content-chars=2500

# ─── OpenAI — Chunk Analysis (LLM decides all chunk boundaries + metadata) ───
# Override model at runtime with env var: OPENAI_CHUNK_MODEL — deliberately no
# fallback to the generic OPENAI_MODEL env var; see LlmChunkAnalyzer's Javadoc.
# Deliberately a stronger model than openai.chat.model: chunk analysis runs
# ONCE per file at ingestion time (never on the live query path), so accuracy
# is worth more here than the latency/cost tradeoff that governs the chat
# model choice. Directly motivated by measuring 684/1284 chunks (53% of a
# real corpus run) misclassified as domain=GENERAL under gpt-4o-mini.
openai.chunk.model=gpt-4o
# Max tokens reserved for the JSON chunk-analysis response, per window.
# gpt-4o-mini's actual completion ceiling is 16,384 — this stays safely under
# that while giving dense, logic-heavy files (lots of chunks with verbose
# metadata per chunk) real headroom to complete a full-size window without
# the model gracefully wrapping up its JSON early (still valid, just short —
# that under-coverage, not malformed JSON, is what "output looks truncated"
# catches, and is what previously drove needless split-and-retry cycles).
openai.chunk.max-tokens=16000
# Batch-mode-ONLY variant of the above (see LlmChunkAnalyzer.buildBatchRequestBody)
# — deliberately smaller. OpenAI reserves a batch request's FULL max_tokens
# against the org's separate "enqueued tokens" batch quota regardless of
# actual output size, so this value directly controls how many files fit in
# one batch group before hitting that quota (see openai.batch.max-enqueued-
# tokens); the synchronous ceiling above stays untouched at 16000. Safe to
# size smaller with ZERO chunk-quality tradeoff: a batch response that comes
# back truncated at this smaller ceiling simply falls back to the exact
# synchronous path above, at the full 16000, for that one file — same
# eventual quality, same retry/window-splitting safety net, just only paid
# for by the files that actually need it. Override with env var
# OPENAI_BATCH_CHUNK_MAX_TOKENS.
openai.batch.chunk-max-tokens=8000
# Large files are split into windows of this many lines (with overlap below)
# before analysis, so input/output size per LLM call stays bounded regardless
# of total file size (a 20,000-line file becomes ~15-20 windows, not one call).
# Kept below the old 1200 default as extra margin against the failure mode above.
openai.chunk.window-lines=900
# A window that keeps failing is recursively split in half and retried, down
# to this floor — below which its raw content is preserved as an "unanalyzed"
# placeholder chunk rather than being dropped.
openai.chunk.window-min-lines=150
# Overlap between consecutive windows so a section straddling a window
# boundary still has full context on at least one side; overlapping chunks
# from adjacent windows are de-duplicated after merging. Also DEFINES how much
# of a window's own coverage shortfall is tolerated without retrying: the
# model often reasonably declines to guess about a paragraph its window's own
# arbitrary line-count cutoff sliced in half, and the next window (which
# starts inside this same overlap zone) picks that up anyway — only a
# shortfall bigger than this is treated as a real failure worth splitting for.
openai.chunk.window-overlap-lines=150
# When your WHOLE corpus is one known business domain (e.g. a single company's
# insurance codebase), set this instead of relying on the model to infer domain
# per-chunk from code alone — measured directly on a mixed corpus: even a
# stronger model + a within-file backfill pass still left 43% of chunks
# GENERAL, because that backfill has nothing to work with when a whole file's
# chunks all come back GENERAL. Override with env var OPENAI_CHUNK_DOMAIN_HINT.
# Left blank here — THIS repo's own dev corpus genuinely mixes insurance +
# AWS CardDemo banking files, so no single hardcoded value would be correct.
# Example for a single-domain deployment: openai.chunk.domain-hint=INSURANCE
openai.chunk.domain-hint=

# ─── OpenAI — Retry (shared by chunk analysis and enrichment) ────────────────
# Exponential backoff (doubling, capped at 30s), or the exact Retry-After
# OpenAI returns when present, for transient failures (timeouts, network
# errors, HTTP 429/5xx). A failure the model itself flags as unfixable by
# retrying (e.g. malformed/incomplete output) skips retries and escalates
# immediately instead (chunk analysis: shrinks the window; enrichment: keeps
# the existing purpose).
# max-attempts raised from 3 -> 6: a live test at moderate concurrency (see
# Main's ingest.parallelism) produced sustained real "HTTP 429" responses
# (not just timeouts), with Retry-After values observed up to ~19s — 3 total
# attempts (2 retries) routinely exhausted before the rate-limit window
# cleared, causing files to permanently fall back to unanalyzed placeholders.
# This is a real, measured fix for real data loss, not a precautionary bump.
openai.retry.max-attempts=6
openai.retry.backoff-ms=2000

# ─── OpenAI — Enrichment concurrency + circuit breaker ───────────────────────
# Enrichment (best-effort sectionPurpose polish, on top of already-good
# chunk-analysis purposes) runs from a SINGLE shared LlmEnricher instance
# used by every concurrently-processing file (see Main.runConcurrently) — so
# without its own cap, it stacks a second wave of concurrent OpenAI traffic
# directly on top of chunk analysis's own. Measured directly: this produced
# sustained HTTP 429s across multiple interleaved files closely enough
# together to trip the circuit breaker on a self-inflicted burst, not a real
# outage. Kept deliberately smaller than ingest.parallelism (file-level
# concurrency) since this traffic is optional polish, not essential like
# chunk analysis. Override with env var OPENAI_ENRICH_MAX_CONCURRENT.
openai.enrich.max-concurrent=2
# After this many CONSECUTIVE enrichment failures, pause enrichment (existing
# chunk-analysis purposes are kept in the meantime) rather than keep
# retrying-and-failing on every remaining chunk one by one.
openai.enrich.circuit-breaker-failures=5
# Unlike a one-way trip for the rest of the run, the circuit is recoverable:
# once this many seconds pass since it opened, the next chunk gets a trial
# attempt: success closes the circuit and enrichment resumes normally;
# failure just resets this cooldown and keeps it paused. On a long run, a
# temporary rough patch shouldn't permanently forfeit enrichment for every
# file processed afterward.
openai.enrich.circuit-cooldown-seconds=60

# ─── Ingestion Parallelism ────────────────────────────────────────────────────
# Small/normal files run concurrently on virtual threads (see Main.runConcurrently),
# bounded to this many actually in-flight OpenAI calls at once via a semaphore —
# not a fixed-batch-then-wait pool, so one slow/retrying file no longer stalls
# everything else already in flight. The real ceiling is your OpenAI account's
# rate limit (RPM/TPM), not JVM thread cost. OpenAI no longer publishes exact
# per-tier numbers in its public docs — check yours at
# platform.openai.com/settings/organization/limits, or read the
# x-ratelimit-limit-requests/x-ratelimit-limit-tokens response headers from one
# live call, then tune this up/down accordingly. Override with env var
# INGEST_PARALLELISM.
# 5 is deliberately conservative: a live test at 10 concurrent produced
# sustained real "OpenAI HTTP 429" errors across multiple simultaneously-
# started files, several of which exhausted retries and fell back to
# unanalyzed placeholders — this account's real headroom is evidently lower
# than a generic guess. Raise only after confirming real headroom via the
# dashboard/response-headers above, and raise gradually while watching for
# 429s in the output, not in one large jump.
ingest.parallelism=5
# A file over this many lines needs multiple LLM chunking-window calls, so
# it's pulled out of the parallel batch above and processed alone, one such
# file at a time — a slow large file no longer holds up the other files in
# its batch, and doesn't compete with PARALLELISM concurrent calls for
# OpenAI rate-limit headroom while working through its many windows.
ingest.large-file-threshold-lines=900

# ─── OpenAI — Batch API (structural fix for rate-limit contention) ───────────
# Batch requests run on OpenAI's own separate queue — NOT the synchronous
# per-model RPM/TPM budget every fix above (retry tuning, enrichment's own
# semaphore/circuit breaker, isolating enrichment's model from chunk-
# analysis's) was really working around. ~50% cheaper too. The one real
# trade-off: completion_window is fixed at 24h (no faster tier exists today),
# so a real ~20,000-file run should be expected to take a genuine multi-hour
# wait, not an instant result — this is not another latency optimization.
# Set to false for a one-line rollback to the fully-synchronous flow proven
# earlier this session, with zero code changes.
ingest.use-batch-api=true
# How often to check a submitted batch's status while waiting.
openai.batch.poll-interval-seconds=30
# OpenAI's confirmed hard cap on requests per batch input file. Lower this to
# force-test the multi-batch-group split path (see BatchJsonl.partition) on a
# small local corpus that would otherwise always fit in one group.
openai.batch.max-requests-per-file=50000
# OpenAI's confirmed hard cap is 200MB; kept under that since exact per-
# request byte size after JSON escaping is hard to predict in advance.
openai.batch.max-file-bytes=150000000
# Per-ORG, per-MODEL cap on tokens sitting in queued/in-progress batches at
# once ("enqueued tokens") — separate from, and typically far stricter than,
# the request-count/file-size caps above, and NOT documented ahead of time
# anywhere in the API (only surfaces via a failed batch's error message).
# Confirmed directly: a 164-request gpt-4o batch at max_tokens=16000/request
# failed immediately with "token_limit_exceeded ... Limit: 90,000 enqueued
# tokens" for this org — since OpenAI reserves a request's FULL max_tokens
# against this budget up front (real output size isn't known until
# generation finishes), 6 requests alone (6*16000=96000) can exceed it.
# Defaulted just under that observed real ceiling (90,000), leaving margin
# only for this estimate's own imprecision (chars/4 is a heuristic, not a
# real tokenizer) — raise this only after confirming a higher real limit for
# your org/model (it scales with OpenAI usage tier) — guessing too high
# fails the WHOLE group, not just trims it. Override with env var
# OPENAI_BATCH_MAX_ENQUEUED_TOKENS.
openai.batch.max-enqueued-tokens=80000
# The only value the Batch API accepts today — config'd so a future faster
# tier is a one-line change here, not a code change.
openai.batch.completion-window=24h
# Safety timeout just above the 24h completion_window: pollUntilTerminal
# throws instead of looping forever if a batch's status never reaches
# terminal, and that group's files/chunks fall back to synchronous
# processing rather than hanging the whole run indefinitely.
openai.batch.max-wait-hours=26

# ─── Source Repository ────────────────────────────────────────────────────────
# Override at runtime with env vars: SOURCE_URL, SOURCE_BRANCH, SOURCE_SUBDIR
# or legacy: GITHUB_OWNER, GITHUB_REPO, GITHUB_BRANCH
source.default.owner=aws-samples
source.default.repo=aws-mainframe-modernization-carddemo
source.default.branch=main
source.default.subdir=